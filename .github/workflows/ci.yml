name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # No `cache: npm` — that requires a lockfile, and we removed the corrupt
      # one from the Kimi export. Caching a few seconds of install is not worth
      # reintroducing the file that crashed npm outright.
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Run #1 failed with three steps at exit 127 (command not found) and a
      # `baseUrl has been removed` error that only TypeScript 7 emits — i.e.
      # devDependencies never landed, so `tsc` resolved to the runner's global
      # TypeScript instead of the project's pinned 5.9.
      #
      # So: no `|| npm install` fallback that can mask a broken install, and
      # devDependencies are requested explicitly. If this step fails the job
      # stops, which is what we want — everything after it would be noise.
      #
      # Run #2 then failed AT this step: `npm ci` demands the lockfile match
      # package.json exactly, and the lockfile shipped in the Kimi export does
      # not. `npm install` reconciles the drift and still installs
      # devDependencies. It is the honest choice here — the alternative is a
      # lockfile regenerated blind by someone who cannot run npm.
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      # Proves the local toolchain is actually on PATH before we blame the code.
      - name: Verify toolchain
        run: |
          echo "node   $(node -v)"
          echo "npm    $(npm -v)"
          echo "tsc    $(npx --no-install tsc --version || echo 'MISSING')"
          echo "vitest $(npx --no-install vitest --version || echo 'MISSING')"
          echo "vite   $(npx --no-install vite --version || echo 'MISSING')"

      # Each step continues on error so ONE run reports every failure category
      # instead of stopping at the first. The gate below fails the build.
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run check

      - name: Unit tests
        id: test
        continue-on-error: true
        run: npm test

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Summary
        run: |
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Typecheck | ${{ steps.typecheck.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ${{ steps.test.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ steps.lint.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ steps.build.outcome }} |" >> $GITHUB_STEP_SUMMARY

      # Lint is advisory; it does not fail the build.
      - name: Gate
        if: steps.typecheck.outcome == 'failure' || steps.test.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload build output
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
