# Wayfare - Render blueprint.
#
# ONE web service. There is no separate static site: this server renders the
# per-trip Open Graph cards that make a shared itinerary preview correctly on
# WhatsApp and Instagram, so the frontend cannot be split onto a static host.
#
# To use: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file, creates the service, and asks for the one value marked
# `sync: false` (DATABASE_URL). Everything else is set here.
services:
  - type: web
    name: wayfare
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Singapore is Render's closest region to India and to a TiDB Cloud
    # ap-southeast cluster - keep the app and the database in the same region
    # or every query pays a round trip across an ocean.
    region: singapore
    # r34: `free` - costs nothing and needs no card. It sleeps after 15 minutes
    # idle and takes ~50 seconds to wake. Switch to `starter` ($7/mo,
    # always on) before sending the link to an investor.
    plan: free
    # /healthz answers immediately; the first-boot corpus load runs in the
    # background AFTER the port is bound, so it never trips the health check.
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # r34: the ONLY value you paste is DATABASE_URL. APP_ID is not secret;
      # APP_SECRET is generated by Render and never leaves the dashboard.
      - key: APP_ID
        value: wayfare-render
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      # APP_URL is optional: the app falls back to RENDER_EXTERNAL_URL, which
      # Render sets automatically. Add APP_URL only for a custom domain.
      # Render generates this one itself - it never needs to leave the
      # dashboard. Signing sessions with a key that is NOT also an OAuth
      # client_secret is the whole point.
      - key: SESSION_SECRET
        generateValue: true
