apply plugin: 'com.android.application'

android {
    namespace "com.wayfare.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wayfare.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    /*
     * r27: release signing.
     *
     * There was no signingConfig at all, so `assembleRelease` produced an
     * unsigned APK that the Play Store rejects and a device refuses to
     * install - the app could not actually ship.
     *
     * Credentials are read from keystore.properties (gitignored) or from
     * environment variables, so CI can sign without a secrets file on disk.
     * When neither is present the release build falls back to unsigned rather
     * than failing, which keeps `./gradlew build` working for contributors who
     * have no keystore.
     */
    signingConfigs {
        release {
            def props = new Properties()
            def propsFile = rootProject.file('keystore.properties')
            if (propsFile.exists()) {
                propsFile.withInputStream { props.load(it) }
            }
            def storePath = props['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
            def storePass = props['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def alias = props['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
            def keyPass = props['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
            if (storePath && storePass && alias && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                keyAlias alias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only attach the config when it actually resolved to a keystore.
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations.all {
    // kotlin-stdlib 1.8+ already bundles these classes; the legacy jdk7/jdk8
    // jars (pulled transitively by cordova-android) duplicate them and fail
    // checkDebugDuplicateClasses.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
